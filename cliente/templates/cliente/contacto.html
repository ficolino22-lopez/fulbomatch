{% load static %}
<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Fulbo Match - Contacto</title>
    <link rel="icon" type="image/x-icon" href="{% static 'cliente/img/favicon.ico' %}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#CCFF00" },
                    fontFamily: { syne: ['Syne', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; } ::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen w-full items-center justify-center p-4">

    <div class="w-full max-w-[440px] bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col gap-5">
        
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h2 class="font-syne font-bold text-base text-white uppercase">CONTACTO / SOPORTE</h2>
                <p class="text-[10px] text-slate-400">Envianos tu consulta o sugerencia</p>
            </div>
            <a href="{% url 'bienvenida' %}" class="text-xs text-slate-400 hover:text-primary">← Volver</a>
        </div>

        <form method="POST" class="flex flex-col gap-3">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="w-full py-4 bg-primary text-slate-950 font-syne font-extrabold text-xs rounded-2xl shadow-lg hover:bg-lime-400 transition-all mt-3">
                🚀 Enviar Mensaje
            </button>
        </form>

        <!-- Mapa de Ubicación (Google Maps Embed) -->
        <div class="flex flex-col gap-2 pt-3 border-t border-slate-800">
            <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Sede / Zona de Encuentros</span>
                <span class="text-[10px] text-primary font-semibold">Zona Oeste · GBA</span>
            </div>
            <div class="w-full h-44 rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 shadow-inner">
                <iframe
                    title="Ubicación Fulbo Match"
                    class="w-full h-full border-0"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    src="https://www.google.com/maps?q=Rafael+Castillo,+Buenos+Aires,+Argentina&output=embed">
                </iframe>
            </div>
        </div>

    </div>
</body>
</html>
