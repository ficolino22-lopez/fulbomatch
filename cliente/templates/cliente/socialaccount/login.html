<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Conectar con Google - Fulbo Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#020617",
                        "surface-card": "#0f172a",
                        "primary": "#CCFF00",
                    },
                    fontFamily: {
                        syne: ['Syne', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen w-full m-0 items-center justify-center p-4">
    <div class="w-full max-w-[440px] bg-slate-900/90 border border-slate-800 rounded-[36px] shadow-2xl p-6 flex flex-col items-center text-center backdrop-blur-md">
        
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-lime-400 to-emerald-500 flex items-center justify-center text-slate-950 font-extrabold text-2xl shadow-xl shadow-primary/20 mb-4">
            🌐
        </div>

        <h1 class="text-2xl font-extrabold tracking-tight font-syne mb-2 text-white">
            Conectar con Google
        </h1>
        <p class="text-xs text-slate-400 leading-relaxed mb-6">
            Estás a un paso de iniciar sesión usando tu cuenta externa de Google en <span class="text-primary font-bold">Fulbo Match</span>.
        </p>

        <form method="post" class="w-full space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full py-4 bg-primary text-darkbase font-syne font-extrabold text-sm rounded-2xl shadow-lg shadow-primary/20 hover:bg-lime-400 active:scale-95 transition-all flex items-center justify-center text-slate-950">
                Continuar
            </button>
        </form>

        <div class="mt-6">
            <a href="{% url 'login' %}" class="text-xs text-slate-400 hover:text-white transition-colors">
                ← Volver al inicio de sesión
            </a>
        </div>

    </div>
</body>
</html>
