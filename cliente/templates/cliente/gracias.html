{% load static %}
<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Fulbo Match - Mensaje Enviado</title>
    <link rel="icon" type="image/x-icon" href="{% static 'cliente/img/favicon.ico' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#CCFF00" },
                    fontFamily: { syne: ['Syne', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen w-full items-center justify-center p-4" data-toastr-messages='[{% for message in messages %}{"tag":"{{ message.tags|escapejs }}","text":"{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]' data-fallback-toast="¡Mensaje enviado con éxito! Te responderemos pronto."></body>

    <div class="w-full max-w-[440px] bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center gap-5">
        <div class="w-16 h-16 rounded-2xl bg-primary/20 flex items-center justify-center text-primary text-2xl font-bold">✨</div>
        <div>
            <h2 class="font-syne font-bold text-lg text-white uppercase">¡MENSAJE ENVIADO!</h2>
            <p class="text-xs text-slate-400 mt-2">Gracias por contactarte. Hemos recibido tu consulta correctamente y te responderemos a la brevedad.</p>
        </div>
        <a href="{% url 'bienvenida' %}" class="w-full py-4 bg-primary text-slate-950 font-syne font-extrabold text-xs rounded-2xl shadow-lg hover:bg-lime-400 transition-all">
            Volver al Inicio
        </a>
    </div>

    <!-- Notificación Toastr.js + jQuery -->
    <script>
        $(document).ready(function () {
            toastr.options = {
                closeButton: true,
                progressBar: true,
                positionClass: "toast-top-right",
                timeOut: "3500"
            };

            const rawMessages = document.body.getAttribute("data-toastr-messages") || "[]";
            const fallbackText = document.body.getAttribute("data-fallback-toast") || "";

            try {
                const items = JSON.parse(rawMessages);
                if (Array.isArray(items) && items.length > 0) {
                    items.forEach(function (item) {
                        const tags = item.tag || "";
                        const text = item.text || "";
                        if (!text) return;

                        if (tags.includes("error")) {
                            toastr.error(text);
                        } else if (tags.includes("warning")) {
                            toastr.warning(text);
                        } else if (tags.includes("info")) {
                            toastr.info(text);
                        } else {
                            toastr.success(text);
                        }
                    });
                } else if (fallbackText) {
                    toastr.success(fallbackText);
                }
            } catch (e) {
                console.error("Error parseando mensajes Toastr en gracias:", e);
                if (fallbackText) {
                    toastr.success(fallbackText);
                }
            }
        });
    </script>
</body>
</html>
